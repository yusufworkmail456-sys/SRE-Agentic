[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agent"
version = "0.1.0"
description = "Agentic SRE Platform — server agent (discovery, collection, controlled execution)"
requires-python = ">=3.12"
dependencies = ["psutil>=5.9", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sre-agent = "sre_agent.main:cli"

[tool.setuptools.packages.find]
include = ["sre_agent*"]

# Agentic SRE Platform — add to existing nginx server block (public vhost)
# Requires auth; adjust to match the vhost that already serves this VM.

location /sre/ {
    auth_basic "SRE Platform";
    auth_basic_user_file /etc/nginx/.htpasswd-sre;

    proxy_pass http://127.0.0.1:9141/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;          # streaming agent activity / SSE
}
